# Built-in base mode: a generic tree of generic nodes. Every mode extends this one unless it says
# otherwise (`extends:`), and only states what differs. Keep it lean: node types, features and rules
# belong in the modes that need them (see decision-tree.yaml).
template: 1
name: base
title: Base
description: A generic tree of plain nodes with the basics only.
config:
  fields:
    body:
      name: Body
      type: text_body
  link_types:
    relates-to:
      name: Relates to
  statuses:
    active:
      name: Active
      role: open
    accepted:
      name: Accepted
      role: accepted
    rejected:
      name: Rejected
      role: rejected
  comments:
    threads: true
nodes: []
