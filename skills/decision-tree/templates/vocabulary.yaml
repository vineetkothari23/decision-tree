template: 1
name: vocabulary
title: Repo vocabulary
extends: default
description: "A shared vocabulary of this repo's words, so humans and agents use the same terms. Read it before planning. Add only words specific to this repo, i.e. named in its code, docs or UI or given a narrower meaning here. Skip general programming or English words. Test: would a new contributor misread it, or fail to find its meaning outside this repo?"
config:
  node_types:
    word:
      name: Word
      prefix: w
      kinds: [common-noun, proper-noun, slang, short-form, abbreviation, phrase, entity]
  fields:
    definition:
      name: Definition
      type: text_body
    meaning:
      name: Meaning
      type: text_body
    usage:
      name: Usage
      type: text_body
    examples:
      name: Examples
      type: list
  link_types:
    in-context-of:
      name: In context of
    aka:
      name: Also known as
    type-of:
      name: Type of
nodes:
  - title: Functional terms
    type: note
    body: |
      Product/domain words users see: features, UI, concepts.
      dtree add vocabulary -p <this note> -t word -k <kind> --title "<word>" --field definition="..."
  - title: Technical terms
    type: note
    body: |
      Code-level words: modules, data structures, commands.
      dtree add vocabulary -p <this note> -t word -k <kind> --title "<word>" --field definition="..."
